services:
  gist:
    build:
      context: .
      dockerfile: Dockerfile
    image: mewthedev/gist:latest
    container_name: gist
    ports:
      - "7209:3000"
    volumes:
      - gist_data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=./data/sqlite.db
      - JWT_SECRET=${JWT_SECRET:-changeme-in-production}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - gist_network

volumes:
  gist_data:
    driver: local

networks:
  gist_network:
    driver: bridge
